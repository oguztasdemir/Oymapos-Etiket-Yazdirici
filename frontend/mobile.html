<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090a0f">
  <title>Mobil Barkod & Etiket Terminali</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    :root {
      --bg: #090a0f;
      --surface: #11141d;
      --card: #141722;
      --card-hover: #1c2130;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --danger: #f43f5e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 24px;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: rgba(17, 20, 29, 0.95);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(16px);
    }
    .logo-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 800;
    }
    .online-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #34d399;
      background: rgba(16, 185, 129, 0.12);
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .online-indicator .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
    }
    .container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
    }
    .camera-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
    }
    #reader {
      width: 100%;
      min-height: 240px;
      background: #000000;
    }
    .camera-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.4);
      border-top: 1px solid var(--border);
    }
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.15);
      transition: .2s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--success); }
    input:checked + .slider:before { transform: translateX(20px); }

    .manual-input-box {
      display: flex;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px;
      border-radius: 14px;
    }
    .manual-input-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: #ffffff;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 600;
      outline: none;
      font-family: 'JetBrains Mono', monospace;
    }
    .manual-input-box button {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .product-card {
      display: none;
      background: linear-gradient(180deg, #171b29 0%, #11141d 100%);
      border: 1.5px solid rgba(99, 102, 241, 0.4);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.6);
    }
    .prod-brand {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #818cf8;
      margin-bottom: 4px;
    }
    .prod-title {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.3;
      color: #ffffff;
      margin-bottom: 12px;
    }
    .prod-price-box {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.35);
      padding: 14px 18px;
      border-radius: 14px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .prod-price {
      font-size: 32px;
      font-weight: 900;
      font-family: 'JetBrains Mono', monospace;
      color: #34d399;
      letter-spacing: -0.02em;
    }
    .prod-barcode {
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
    }
    .print-status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 10px 14px;
      border-radius: 12px;
      color: #34d399;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .print-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-action {
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-action:active { transform: scale(0.97); }
    .btn-print-again { background: var(--primary); color: #ffffff; }
    .btn-clear { background: rgba(255, 255, 255, 0.08); color: var(--text-muted); }

    .history-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }
    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 13px;
    }

    .toast-container {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      padding: 12px 16px;
      background: #1e1b4b;
      border: 1px solid #6366f1;
      border-radius: 12px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div class="toast-container" id="toastContainer"></div>

  <div class="top-bar">
    <div class="logo-badge">
      <span>🏷️ Mobil Etiket Terminali</span>
    </div>
    <div class="online-indicator">
      <span class="dot"></span>
      <span>Ana PC Bağlı</span>
    </div>
  </div>

  <div class="container">
    <div class="camera-card">
      <div id="reader"></div>
      <div class="camera-controls">
        <div class="toggle-wrap">
          <label class="switch">
            <input type="checkbox" id="autoPrintSwitch" checked>
            <span class="slider"></span>
          </label>
          <span>Otomatik Yazdır</span>
        </div>
      </div>
    </div>

    <form class="manual-input-box" onsubmit="handleManualSearch(event)">
      <input type="text" id="manualBarcodeInput" placeholder="Barkod okutun veya yazın..." autofocus autocomplete="off">
      <button type="submit">Bul & Bas</button>
    </form>

    <div class="product-card" id="productCard">
      <div class="prod-brand" id="prodBrand">MARKA</div>
      <div class="prod-title" id="prodTitle">Ürün Adı</div>
      <div class="prod-price-box">
        <div class="prod-price" id="prodPrice">₺ 0.00</div>
        <div class="prod-barcode" id="prodBarcode">8690000000000</div>
      </div>
      
      <div class="print-status-badge" id="printBadge">
        <span>🖨️</span>
        <span id="printStatusMsg">Ana PC Yazıcısına Gönderildi!</span>
      </div>

      <div class="print-actions">
        <button type="button" class="btn-action btn-print-again" onclick="reprintCurrent()">
          <span>🖨️ 1 Adet Daha Bas</span>
        </button>
        <button type="button" class="btn-action btn-clear" onclick="clearCurrentProduct()">
          <span>✕ Kapat</span>
        </button>
      </div>
    </div>

    <!-- Son Tarananlar Geçmişi -->
    <div class="history-card" id="historyCard" style="display:none;">
      <div class="history-header">
        <span>🕒 Son Taranan Ürünler</span>
        <button onclick="clearHistory()" style="background:none; border:none; color:var(--danger); font-size:11px; font-weight:700; cursor:pointer;">Temizle</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <script src="/frontend/js/mobile.js?v={{ cache_bust }}"></script>
</body>
</html>
