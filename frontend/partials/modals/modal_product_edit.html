<!-- HIZLI ÜRÜN DÜZENLEME MODALI (INLINE EDIT) -->
<div id="modal-product-edit" class="modal-backdrop" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(6px); z-index:99999; align-items:center; justify-content:center; padding:20px;">
  <div class="modal-card" style="background:#0b1329; border:1px solid rgba(56,189,248,0.35); border-radius:14px; max-width:520px; width:100%; box-shadow:0 25px 70px rgba(0,0,0,0.95); overflow:hidden; display:flex; flex-direction:column;">
    
    <!-- Header -->
    <div style="display:flex; justify-content:space-between; align-items:center; padding:16px 20px; background:#070d1e; border-bottom:1px solid rgba(255,255,255,0.08);">
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="font-size:22px;">✏️</span>
        <div>
          <h3 style="font-size:15px; font-weight:800; color:#fff; margin:0;">Ürün Bilgilerini Düzenle</h3>
          <span style="font-size:11px; color:#94a3b8;">Değişiklikler otomatik geçmişe kaydedilir</span>
        </div>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="closeProductEditModal()" style="padding:4px 10px; font-size:13px; border-radius:6px;">✕</button>
    </div>

    <!-- Form Body -->
    <div style="padding:22px 20px; display:flex; flex-direction:column; gap:14px;">
      <div style="display:grid; grid-template-columns: 140px 1fr; gap:12px;">
        <div>
          <label style="font-size:11.5px; font-weight:700; color:#94a3b8; display:block; margin-bottom:4px;">Barkod:</label>
          <input type="text" id="editModalBarcode" class="form-input" disabled style="background:rgba(255,255,255,0.04); color:#94a3b8; font-family:'JetBrains Mono', monospace; font-weight:700;">
        </div>
        <div>
          <label style="font-size:11.5px; font-weight:700; color:#64748b; display:block; margin-bottom:4px;">Sistemdeki Ham Adı:</label>
          <input type="text" id="editModalRawTitle" class="form-input" disabled style="background:rgba(255,255,255,0.04); color:#38bdf8; font-size:12px;">
        </div>
      </div>

      <div>
        <label style="font-size:11.5px; font-weight:700; color:#38bdf8; display:block; margin-bottom:4px;">🏷️ Yazıcıda Basılacak Ürün Adı (Etiket Adı):</label>
        <input type="text" id="editModalTitle" class="form-input" placeholder="Etikette gözükecek ürün adını girin..." style="font-weight:700; color:#fff;">
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div>
          <label style="font-size:11.5px; font-weight:700; color:#fbbf24; display:block; margin-bottom:4px;">Satış Fiyatı (TL):</label>
          <input type="number" step="0.01" id="editModalPrice" class="form-input" placeholder="0.00" style="font-weight:800; color:#fbbf24; font-family:'JetBrains Mono', monospace;">
        </div>
        <div>
          <label style="font-size:11.5px; font-weight:700; color:#94a3b8; display:block; margin-bottom:4px;">Marka / Üretici:</label>
          <input type="text" id="editModalBrand" class="form-input" placeholder="Örn: YARENLER">
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div style="display:flex; justify-content:flex-end; gap:10px; padding:14px 20px; background:#070d1e; border-top:1px solid rgba(255,255,255,0.08);">
      <button class="btn btn-secondary" onclick="closeProductEditModal()">İptal</button>
      <button id="editModalSaveBtn" class="btn btn-primary" onclick="saveProductEdit()" style="font-weight:800; padding:8px 20px; background:linear-gradient(135deg, #10b981, #059669);">
        💾 Kaydet & Geçmişe İşle
      </button>
    </div>

  </div>
</div>
