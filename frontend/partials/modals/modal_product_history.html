<!-- ÜRÜN DEĞİŞİKLİK GEÇMİŞİ & GERİ ALMA MODALI (TIMELINE & AUDIT) -->
<div id="modal-product-history" class="modal-backdrop" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(6px); z-index:99999; align-items:center; justify-content:center; padding:20px;">
  <div class="modal-card" style="background:#0b1329; border:1px solid rgba(99,102,241,0.35); border-radius:14px; max-width:680px; width:100%; box-shadow:0 25px 70px rgba(0,0,0,0.95); overflow:hidden; display:flex; flex-direction:column; max-height:90vh;">
    
    <!-- Header -->
    <div style="display:flex; justify-content:space-between; align-items:center; padding:16px 20px; background:#070d1e; border-bottom:1px solid rgba(255,255,255,0.08);">
      <div style="display:flex; align-items:center; gap:12px;">
        <span style="font-size:24px;">🕒</span>
        <div>
          <h3 style="font-size:15px; font-weight:800; color:#fff; margin:0;" id="histModalTitle">Ürün Değişiklik Zaman Çizelgesi</h3>
          <span style="font-size:11.5px; color:#818cf8; font-family:'JetBrains Mono', monospace;" id="histModalBarcode"></span>
        </div>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="closeProductHistoryModal()" style="padding:4px 10px; font-size:13px; border-radius:6px;">✕</button>
    </div>

    <!-- Current Info Bar -->
    <div style="padding:12px 20px; background:rgba(15,23,42,0.9); border-bottom:1px solid rgba(255,255,255,0.06); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <div style="font-size:12px; color:#94a3b8;">
        Mevcut Durum: <strong style="color:#fff;" id="histCurrentTitle">-</strong>
      </div>
      <div style="font-size:13px; font-weight:800; color:#fbbf24; font-family:'JetBrains Mono', monospace;" id="histCurrentPrice">
        - TL
      </div>
    </div>

    <!-- Timeline List Area -->
    <div style="padding:20px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:12px;" id="histTimelineList">
      <div style="text-align:center; padding:30px; color:#94a3b8;">
        ⏳ Geçmiş hareketler yükleniyor...
      </div>
    </div>

    <!-- Footer -->
    <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 20px; background:#070d1e; border-top:1px solid rgba(255,255,255,0.08);">
      <span style="font-size:11.5px; color:#94a3b8;">💡 Herhangi bir geçmiş durumuna "Geri Dön" butonu ile tek tıkla dönebilirsiniz.</span>
      <button class="btn btn-secondary btn-sm" onclick="closeProductHistoryModal()">Kapat</button>
    </div>

  </div>
</div>
